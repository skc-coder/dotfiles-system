# kitty.conf
# Place at: ~/.config/kitty/kitty.conf

# ---------- Font ----------
font_family      Agave
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0


# ---------- Cursor ----------
cursor_shape     beam
cursor_blink_interval 0

# ---------- Window ----------
window_padding_width 10
confirm_os_window_close 0

# ---------- Scrollback ----------
scrollback_lines 10000

# ---------- Bell ----------
enable_audio_bell no

# ---------- Colors: Windows XP Luna (Modular) ----------
include themes/xp-luna.conf

# ---------- Tab bar ----------
tab_bar_style        powerline
tab_powerline_style   slanted
active_tab_background   #7aa2f7
active_tab_foreground   #1a1b26
inactive_tab_background #414868
inactive_tab_foreground #a9b1d6

env JAVA_TOOL_OPTIONS=-XX:+DisableAttachMechanism
env _JAVA_OPTIONS=-XX:+DisableAttachMechanism
env JDK_JAVA_OPTIONS=-XX:+DisableAttachMechanism
