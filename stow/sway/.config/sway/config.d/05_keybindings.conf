### Keybindings

## Function / Fn / Hardware Keys
bindsym $mod+F5 exec /home/skc/dev/dotfiles/scripts/fan-toggle.sh
bindsym XF86AudioMute exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindsym XF86AudioLowerVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindsym XF86AudioRaiseVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindsym XF86AudioMicMute exec wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bindsym XF86AudioPlay exec playerctl play-pause
bindsym XF86AudioNext exec playerctl position 20+
bindsym XF86AudioPrev exec playerctl position 20-

bindsym XF86MonBrightnessUp exec brightnessctl set +5%
bindsym XF86MonBrightnessDown exec brightnessctl set 5%-

bindsym XF86KbdBrightnessUp exec brightnessctl -d '::kbd_backlight' set +10%
bindsym XF86KbdBrightnessDown exec brightnessctl -d '::kbd_backlight' set 10%-

bindsym XF86ScreenSaver exec brightnessctl set 0% --save || brightnessctl set 50% --restore
bindsym XF86Sleep exec systemctl suspend
bindsym XF86RFKill exec nmcli radio wifi toggle
bindsym $mod+F10 input "1267:12432:ELAN1200:00_04F3:3090_Touchpad" events toggle enabled disabled

## Applications & Launchers
bindsym $mod+Return exec $term
bindsym $mod+d exec $menu
bindsym $mod+space exec $menu
bindsym $mod+v exec copyq toggle
bindsym $mod+b exec $web
bindsym Ctrl+b exec $web
bindsym $mod+Shift+b exec ~/.local/bin/browser-selector
bindsym Ctrl+Shift+b exec ~/.local/bin/browser-selector
bindsym $mod+e exec $explorer

## Lock / Session / Exit
bindsym $mod+Shift+BackSpace exec swaylock -f
bindsym $mod+Shift+r reload
bindsym $mod+q kill

## Focus Navigation
bindsym $mod+h focus left
bindsym $mod+j focus down
bindsym $mod+k focus up
bindsym $mod+l focus right

bindsym $mod+Left focus left
bindsym $mod+Right focus right
bindsym $mod+Up focus up
bindsym $mod+Down focus down

bindsym $alt+Left focus left
bindsym $alt+Right focus right
bindsym $alt+Up focus up
bindsym $alt+Down focus down

## Window Movement & Layout
bindsym $mod+Shift+h move left
bindsym $mod+Shift+j move down
bindsym $mod+Shift+k move up
bindsym $mod+Shift+l move right

bindsym $mod+f fullscreen
bindsym $mod+s layout toggle split
bindsym $mod+t layout tabbed
bindsym $mod+Shift+space floating toggle
bindsym $mod+Ctrl+space exec /home/skc/.local/bin/sway-toggle-persist-floating.sh
bindsym $mod+BackSpace split toggle

## Workspaces
bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+5 workspace number 5
bindsym $mod+6 workspace number 6
bindsym $mod+7 workspace number 7
bindsym $mod+8 workspace number 8
bindsym $mod+9 workspace number 9
bindsym $mod+0 workspace number 10

bindsym $mod+Shift+1 move container to workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3
bindsym $mod+Shift+4 move container to workspace number 4
bindsym $mod+Shift+5 move container to workspace number 5
bindsym $mod+Shift+6 move container to workspace number 6
bindsym $mod+Shift+7 move container to workspace number 7
bindsym $mod+Shift+8 move container to workspace number 8
bindsym $mod+Shift+9 move container to workspace number 9
bindsym $mod+Shift+0 move container to workspace number 10

## Scratchpad
bindsym $mod+minus scratchpad show
bindsym $mod+Shift+minus move scratchpad

## Custom Rofi & Utility Shortcuts
bindsym $mod+Shift+e exec ~/.local/bin/rofi-power-menu.sh
bindsym $mod+Period exec ~/.local/bin/rofi-emoji.sh
bindsym $mod+question exec ~/.local/bin/sway-keybindings-manager.sh
bindsym $mod+p exec ~/.local/bin/rofi-file-search.sh
bindsym $mod+a exec ~/.local/bin/rofi-audio-switcher.sh
bindsym $mod+slash exec ~/.local/bin/rofi-quick-runner.sh
bindsym $mod+u exec ~/.local/bin/toggle-scratchpad-term.sh

## Sentry / Dotfiles Shortcuts
bindsym Mod4+Shift+o exec ~/.local/bin/ocr_screenshot.sh
bindsym Mod4+Shift+P exec ~/.local/bin/pomodoro-engine.sh toggle
bindsym Print exec env QT_QPA_PLATFORM=wayland QT_AUTO_SCREEN_SCALE_FACTOR=0 QT_SCALE_FACTOR=1 flameshot gui
bindsym Mod4+Shift+V exec ~/.local/bin/vpn-toggle.sh
bindsym Mod4+Shift+W exec ~/.local/bin/wallpaper-selector.sh
bindsym Mod1+h exec ~/.local/bin/voice-dictate --toggle

## Resize Mode
mode "resize" {
    bindsym h resize shrink width 40 px
    bindsym j resize grow height 40 px
    bindsym k resize shrink height 40 px
    bindsym l resize grow width 40 px

    bindsym Left resize shrink width 40 px
    bindsym Right resize grow width 40 px
    bindsym Up resize shrink height 40 px
    bindsym Down resize grow height 40 px

    bindsym Return mode "default"
    bindsym Escape mode "default"
}

bindsym $mod+r mode "resize"
