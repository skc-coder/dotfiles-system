### Display & Appearance
output eDP-1 scale 1

# Wallpaper setting (uses current_wallpaper symlink or direct fallback)
output * bg /home/skc/.config/sway/current_wallpaper fill

gaps inner 8
gaps outer 4
smart_gaps on

default_border pixel 2
default_floating_border pixel 2

### Colors (Nord-ish)
client.focused          #88c0d0 #88c0d0 #2e3440 #88c0d0 #88c0d0
client.unfocused        #3b4252 #3b4252 #d8dee9 #3b4252 #3b4252
client.urgent           #bf616a #bf616a #eceff4 #bf616a #bf616a

# Global Dark Mode
exec_always gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
exec_always gsettings set org.gnome.desktop.interface gtk-theme 'Mint-Y-Dark'
